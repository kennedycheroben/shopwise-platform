---
deployment:
  tasks:
    - export APPPATH=/home/xqtrqexj/shopwise-app
    - export DEPLOYPATH=/home/xqtrqexj/shopwise.kennedycheroben.co.ke
    - /bin/mkdir -p ${APPPATH} ${DEPLOYPATH}
    - /bin/mkdir -p ${APPPATH}/app ${APPPATH}/cron ${APPPATH}/database ${APPPATH}/scripts ${APPPATH}/vendor ${APPPATH}/public
    - /bin/mkdir -p ${APPPATH}/app/storage/logs ${APPPATH}/app/storage/sessions ${APPPATH}/app/storage/cache ${APPPATH}/app/storage/payments ${APPPATH}/app/storage/rate_limits
    - /bin/mkdir -p ${DEPLOYPATH}/assets ${DEPLOYPATH}/admin ${DEPLOYPATH}/uploads/products
    - /bin/cp -R app ${APPPATH}/
    - /bin/cp -R cron ${APPPATH}/
    - /bin/cp -R database ${APPPATH}/
    - /bin/cp -R scripts ${APPPATH}/
    - /bin/cp -R vendor ${APPPATH}/
    - /bin/cp -R public/admin ${APPPATH}/public/
    - /bin/cp public/index.php ${APPPATH}/public/index.php
    - /bin/cp composer.json ${APPPATH}/composer.json 2>/dev/null || true
    - /bin/cp composer.lock ${APPPATH}/composer.lock 2>/dev/null || true
    - /bin/cp -R public/assets/. ${DEPLOYPATH}/assets/
    - /bin/mkdir -p ${DEPLOYPATH}/admin/assets
    - /bin/cp -R public/admin/assets/. ${DEPLOYPATH}/admin/assets/
    - /bin/cp public/.htaccess ${DEPLOYPATH}/.htaccess
    - /bin/cp public/uploads/.htaccess ${DEPLOYPATH}/uploads/.htaccess 2>/dev/null || true
    - /bin/bash -c 'echo "<?php declare(strict_types=1); require \"/home/xqtrqexj/shopwise-app/public/index.php\";" > ${DEPLOYPATH}/index.php'
    - /bin/bash -c 'find ${APPPATH}/public/admin -type f -name "*.php" | while read -r f; do rel="${f#${APPPATH}/public/admin/}"; dest="${DEPLOYPATH}/admin/${rel}"; /bin/mkdir -p "$(/usr/bin/dirname "$dest")"; echo "<?php declare(strict_types=1); require \"${f}\";" > "$dest"; done'
    - /usr/bin/find ${APPPATH} -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find ${APPPATH} -type f -exec /bin/chmod 644 {} +
    - /usr/bin/find ${DEPLOYPATH} -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find ${DEPLOYPATH} -type f -exec /bin/chmod 644 {} +
    - /bin/bash -c "git rev-parse HEAD > ${APPPATH}/.deployed_commit 2>/dev/null || true; if [ -f ${APPPATH}/.deployed_commit ]; then /bin/cp ${APPPATH}/.deployed_commit ${DEPLOYPATH}/.deployed_commit 2>/dev/null || true; fi"
